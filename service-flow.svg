<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 820"><rect width="620" height="820" rx="28" fill="#f2eee7"/><g font-family="Arial, sans-serif" fill="#172b3d"><text x="48" y="58" font-size="15" letter-spacing="3.5" fill="#b08a5a">HOW IT WORKS</text><text x="48" y="98" font-size="29" font-weight="700">一個完整的信任流程</text><g transform="translate(48 145)"><g><rect width="524" height="104" rx="20" fill="#fffdf9"/><circle cx="53" cy="52" r="31" fill="#172b3d"/><text x="53" y="58" text-anchor="middle" font-size="15" fill="#fff">01</text><text x="105" y="45" font-size="18" font-weight="700">提出需求</text><text x="105" y="70" font-size="13" fill="#737b80">使用者說明需要什麼陪伴</text></g><path d="M262 104v30" stroke="#b08a5a" stroke-width="3"/><path d="M255 125l7 10 7-10" fill="none" stroke="#b08a5a" stroke-width="3"/><g transform="translate(0 142)"><rect width="524" height="104" rx="20" fill="#fffdf9"/><circle cx="53" cy="52" r="31" fill="#b08a5a"/><text x="53" y="58" text-anchor="middle" font-size="15" fill="#fff">02</text><text x="105" y="45" font-size="18" font-weight="700">身份與審查</text><text x="105" y="70" font-size="13" fill="#737b80">建立服務者的可信任資訊</text></g><path d="M262 246v30" stroke="#b08a5a" stroke-width="3"/><path d="M255 267l7 10 7-10" fill="none" stroke="#b08a5a" stroke-width="3"/><g transform="translate(0 284)"><rect width="524" height="104" rx="20" fill="#fffdf9"/><circle cx="53" cy="52" r="31" fill="#172b3d"/><text x="53" y="58" text-anchor="middle" font-size="15" fill="#fff">03</text><text x="105" y="45" font-size="18" font-weight="700">找到適合的人</text><text x="105" y="70" font-size="13" fill="#737b80">依需求與服務條件進行媒合</text></g><path d="M262 388v30" stroke="#b08a5a" stroke-width="3"/><path d="M255 409l7 10 7-10" fill="none" stroke="#b08a5a" stroke-width="3"/><g transform="translate(0 426)"><rect width="524" height="104" rx="20" fill="#fffdf9"/><circle cx="53" cy="52" r="31" fill="#b08a5a"/><text x="53" y="58" text-anchor="middle" font-size="15" fill="#fff">04</text><text x="105" y="45" font-size="18" font-weight="700">完成服務</text><text x="105" y="70" font-size="13" fill="#737b80">在平台流程下完成服務體驗</text></g><path d="M262 530v30" stroke="#b08a5a" stroke-width="3"/><path d="M255 551l7 10 7-10" fill="none" stroke="#b08a5a" stroke-width="3"/><g transform="translate(0 568)"><rect width="524" height="104" rx="20" fill="#172b3d"/><circle cx="53" cy="52" r="31" fill="#fff"/><text x="53" y="58" text-anchor="middle" font-size="15" fill="#172b3d">05</text><text x="105" y="45" font-size="18" font-weight="700" fill="#fff">回饋與累積</text><text x="105" y="70" font-size="13" fill="#d5dde2">讓每一次服務成為下一次信任的基礎</text></g></g></g></svg>