<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f7f4ef"/><g font-family="Arial, sans-serif" fill="#182b3d"><text x="60" y="55" font-size="18" letter-spacing="4" fill="#9a7b56">HOW IT WORKS</text><text x="60" y="92" font-size="34" font-weight="700">需求 → 信任 → 媒合 → 服務 → 回饋</text><g transform="translate(60 145)"><g><circle cx="45" cy="45" r="40" fill="#182b3d"/><text x="45" y="52" text-anchor="middle" font-size="18" fill="white">01</text><text x="45" y="112" text-anchor="middle" font-size="17" font-weight="700">提出需求</text></g><path d="M100 45h90" stroke="#9a7b56" stroke-width="3"/><path d="M180 37l12 8-12 8" fill="none" stroke="#9a7b56" stroke-width="3"/><g transform="translate(200)"><circle cx="45" cy="45" r="40" fill="#9a7b56"/><text x="45" y="52" text-anchor="middle" font-size="18" fill="white">02</text><text x="45" y="112" text-anchor="middle" font-size="17" font-weight="700">身份與審查</text></g><path d="M300 45h90" stroke="#9a7b56" stroke-width="3"/><path d="M380 37l12 8-12 8" fill="none" stroke="#9a7b56" stroke-width="3"/><g transform="translate(400)"><circle cx="45" cy="45" r="40" fill="#182b3d"/><text x="45" y="52" text-anchor="middle" font-size="18" fill="white">03</text><text x="45" y="112" text-anchor="middle" font-size="17" font-weight="700">找到適合的人</text></g><path d="M500 45h90" stroke="#9a7b56" stroke-width="3"/><path d="M580 37l12 8-12 8" fill="none" stroke="#9a7b56" stroke-width="3"/><g transform="translate(600)"><circle cx="45" cy="45" r="40" fill="#9a7b56"/><text x="45" y="52" text-anchor="middle" font-size="18" fill="white">04</text><text x="45" y="112" text-anchor="middle" font-size="17" font-weight="700">完成服務</text></g><path d="M700 45h80" stroke="#9a7b56" stroke-width="3"/><path d="M770 37l12 8-12 8" fill="none" stroke="#9a7b56" stroke-width="3"/><g transform="translate(790)"><circle cx="45" cy="45" r="40" fill="#182b3d"/><text x="45" y="52" text-anchor="middle" font-size="18" fill="white">05</text><text x="45" y="112" text-anchor="middle" font-size="17" font-weight="700">回饋</text></g></g></g></svg>