<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f3ee">
<title>RE WITH｜Medical Companion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body><iframe id="v3" src="index-v3-original.html?v=20260813-5" title="RE WITH Medical Companion"></iframe>
<script>
const frame=document.getElementById('v3');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const style=d.createElement('style');
  style.textContent=`
    .nav{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 42px;background:#fffdfa;border-bottom:1px solid #e7ddd5}
    .brand{display:flex;align-items:center;text-decoration:none;height:48px;flex:none}
    .brand img{width:154px;height:48px;object-fit:contain;object-position:left center;display:block}
    .brand span{display:none}
    .navlinks{display:flex;gap:25px;align-items:center}
    .navlinks a{font-size:13px;color:#183049;text-decoration:none;white-space:nowrap}
    .navlinks .cta{background:#e59a96;color:#fff;padding:11px 18px;border-radius:999px}
    .needs .need.pet{grid-column:1/-1}
    .market-scenarios{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}
    .market-scenario{padding:22px 18px;border:1px solid #e7ddd5;border-radius:18px;background:#fff}
    .market-scenario b{display:block;font-size:15px;color:#183049;margin-bottom:8px}
    .market-scenario span{display:block;color:#747b79;font-size:12px;line-height:1.7}
    .market-kicker{font-size:16px;font-weight:800;margin-top:34px;color:#183049}
    .market-note{font-size:14px;line-height:1.9;color:#747b79;margin:10px 0 0}
    @media(max-width:1100px){.market-scenarios{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:900px){.nav{height:72px;padding:0 18px}.brand img{width:136px;height:44px}.navlinks{overflow-x:auto;flex:1;gap:18px;justify-content:flex-start;scrollbar-width:none}.navlinks::-webkit-scrollbar{display:none}.navlinks a{font-size:12px}.needs .need.pet{grid-column:auto}.market-scenarios{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.nav{padding:0 14px}.brand img{width:128px}.navlinks{gap:16px}.navlinks a{font-size:11px}.market-scenarios{grid-template-columns:1fr}}
  `;
  d.head.appendChild(style);
  const logo=d.querySelector('.brand img');
  if(logo){logo.src='(0) RE_WITH_logo_corrected.png?v=5';logo.alt='RE WITH';logo.removeAttribute('width');logo.removeAttribute('height')}
  const heroImage=d.querySelector('.hero-photo img');
  if(heroImage){heroImage.src='(1) 8E397198-8475-4462-A96E-2986FEDD8659.PNG?v=5';heroImage.alt='RE WITH 就醫陪伴服務'}
  const storyImage=d.querySelector('.story-photo img');
  if(storyImage){storyImage.src='一人看診.png?v=5';storyImage.alt='一人就醫陪診'}
  const appImage=d.querySelector('.app img');
  if(appImage){appImage.src='app介面模擬.jpg?v=5';appImage.alt='RE WITH App 介面模擬'}
  const familyImage=d.querySelector('.family-photo img');
  if(familyImage){familyImage.src='海外預約.jpg?v=20260813-5';familyImage.alt='海外子女與台灣父母'}
  const marketSection=[...d.querySelectorAll('.section')].find(s=>{const e=s.querySelector('.ey');return e&&e.textContent.trim().startsWith('06')});
  if(marketSection){
    marketSection.id='business';
    marketSection.innerHTML=`
      <div class="ey">06 · 市場需求</div>
      <h2>當「誰來陪我看醫生」成為每個家庭都可能遇到的問題。</h2>
      <div class="market">
        <div class="card"><h3>我們都可能有需要陪診的時候。</h3><p>單身、頂客、孕婦、獨居長者，或家人身處不同城市與海外——<strong>不是沒有家人，而是家人不一定能在需要的那一天出現。</strong></p></div>
        <div class="card"><h3>RE WITH，讓陪診多一個選擇。</h3><p>由經過認證的陪診員，協助完成預約、到院陪診與安全返家，讓原本只能依靠家人的陪伴，成為<strong>可以放心託付的服務。</strong></p></div>
      </div>
      <div class="market-kicker">典型需求場景</div>
      <p class="market-note">陪診需求存在於不同人生階段與家庭情境。</p>
      <div class="market-scenarios">
        <div class="market-scenario"><b>孕婦產檢</b><span>陪同產檢與醫療流程。</span></div>
        <div class="market-scenario"><b>單身就醫</b><span>需要有人陪同完成醫療行程。</span></div>
        <div class="market-scenario"><b>年邁雙親</b><span>子女不在身邊時，協助父母就醫。</span></div>
        <div class="market-scenario"><b>海外子女</b><span>人在海外，也能安排父母陪診。</span></div>
        <div class="market-scenario"><b>寵物陪診</b><span>飼主無法到場時，協助陪同就醫。</span></div>
      </div>
    `;
  }
  const brand=d.querySelector('.brand');
  if(brand){const span=brand.querySelector('span');if(span) span.remove()}
  const needs=d.querySelector('.needs');
  if(needs && !needs.querySelector('.pet')){
    const pet=d.createElement('div');
    pet.className='need pet';
    pet.innerHTML='<b>寵物陪診</b><span>飼主無法到場時，協助陪同寵物就醫、候診與完成返家流程。</span>';
    needs.appendChild(pet);
  }
});
</script>
</body>
</html>
