.investment-impact{font-size:12px;line-height:1.8;color:#dce4e8;margin-top:10px}@media(max-width:900px){.nav{height:72px;padding:0 18px}.brand img{width:136px;height:44px}.navlinks{overflow-x:auto;flex:1;gap:18px;justify-content:flex-start;scrollbar-width:none}.navlinks::-webkit-scrollbar{display:none}.navlinks a{font-size:12px}.founder-copy{font-size:14px}.invest-grid{grid-template-columns:1fr;gap:35px}.app,.family-photo{height:auto!important;overflow:visible!important}.app img,.family-photo img{width:100%!important;height:auto!important;display:block!important;object-fit:contain!important;object-position:center!important}.trust img,.levels img{max-width:100%;height:auto!important;object-fit:contain!important}}@media(max-width:520px){.nav{padding:0 14px}.brand img{width:128px}.navlinks{gap:16px}.navlinks a{font-size:11px}.list div{font-size:12px}.app,.family-photo{height:auto!important}.app img,.family-photo img{height:auto!important;object-fit:contain!important}}`;d.head.appendChild(style);const logo=d.querySelector('.brand img');if(logo){logo.src='(0) RE_WITH_logo_corrected.png?v=08final4';logo.alt='RE WITH';logo.removeAttribute('width');logo.removeAttribute('height')}const heroImage=d.querySelector('.hero-photo img');if(heroImage){heroImage.src='(1) 8E397198-8475-4462-A96E-2986FEDD8659.PNG?v=08final4';heroImage.alt='RE WITH 就醫陪伴服務'}const storyImage=d.querySelector('.story-photo img');if(storyImage){storyImage.src='一人看診.png?v=08final4';storyImage.alt='一人就醫陪診'}const appImage=d.querySelector('.app img');if(appImage){appImage.src='app介面模擬.jpg?v=08final4';appImage.alt='RE WITH App 介面模擬'}const familyImage=d.querySelector('.family-photo img');if(familyImage){familyImage.src='海外預約.jpg?v=08final4';familyImage.alt='海外子女與台灣父母'}const business=d.querySelector('#business');if(business){[...business.querySelectorAll('*')].forEach(el=>{const text=el.textContent.trim();if((text==='典型需求場景'||text==='陪診需求存在於不同人生階段與家庭情境。')&&el.children.length===0)el.remove()})}const founder=d.querySelector('.founder');if(founder){founder.innerHTML=`<div><div class="ey">07 · 為什麼是 RE WITH</div><div class="founder-statement">「我曾經就是那個獨自走進診間的人。」</div></div><div class="founder-copy"><p>在過去的醫療旅程中，我經歷過無數次一個人面對醫師、診療與手術的時刻。</p><p>當我和朋友分享自己的經歷時，才發現這在這一代人中其實很常見——甚至連產檢、生產，都可能是一個人面對。</p><p>這讓我深刻體會到：當代人的生活、家庭結構與親密關係早已改變。很多人因為忙碌或無人陪伴，而延後就醫，甚至把小病拖成大病。</p><p>而我，因為預防醫療走進醫院。我比較勇敢嗎？還是我比較幸運，有朋友陪伴？</p><p>如果有專業的陪同團隊，提供陪伴患者就醫的服務，讓人們在需要時有人可以陪、協助紀錄醫囑、給予情緒支持，也許就能讓更多人願意面對治療，更願意做好預防醫療。</p><p><strong>RE WITH，就是為了提供一個可信任的陪伴者，陪伴每一位需要就醫的人。</strong></p><p><strong>姚妍萱 | Founder of Re-Re</strong></p></div>`}const investment=d.querySelector('#investment');if(investment){investment.innerHTML=`<div class="invest-grid"><div><div class="ey" style="color:#e7a09d">08 · 投資合作</div><h2>一起建立就醫陪伴服務平台。</h2><div class="investment-goal"><div class="investment-goal-label">投資目的</div><div class="investment-goal-main">讓「沒有人陪我看醫生」，不再是一個人的問題。</div><div class="investment-impact">就醫陪伴｜減輕家人壓力｜創造新工作機會</div></div></div><div><div class="investment-goal-label" style="margin-bottom:14px">下一階段，我們要完成五件事</div><div class="list"><div><b>01｜平台與產品</b><span>建立預約、媒合、付款與服務紀錄</span></div><div><b>02｜陪診員體系</b><span>招募、職前訓練、認證與服務標準</span></div><div><b>03｜安全與保障</b><span>身分驗證、背景查核、法律規範與服務保障</span></div><div><b>04｜市場驗證</b><span>從台北開始，驗證使用需求、服務流程與商業模式</span></div><div><b>05｜合作拓展</b><span>建立醫療院所、企業與相關服務合作</span></div></div></div></div>`}const closingLine=[...d.querySelectorAll('*')].find(el=>el.children.length===0&&el.textContent.trim()==='當家人無法到場，委託一個值得信任的人，陪你完成一次就醫。');if(closingLine)closingLine.remove();const navlinks=d.querySelector('.navlinks');if(navlinks){[...navlinks.querySelectorAll('a')].forEach(a=>{if(a.textContent.trim()==='給家人的安心')a.remove()})}const brand=d.querySelector('.brand');if(brand){const span=brand.querySelector('span');if(span)span.remove()}});</script></body></html>
