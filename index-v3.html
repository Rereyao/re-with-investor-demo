<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RE WITH｜Medical Companion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fffdfa;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="v3" src="index-v3-original.html" title="RE WITH Medical Companion"></iframe>
<script>
const frame=document.getElementById('v3');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const style=d.createElement('style');
  style.textContent=`
    .nav{background:#fffdfa!important}
    .brand{gap:10px!important}
    .brand img{width:48px!important;height:48px!important;object-fit:contain!important}
    .brand span{font-size:24px!important;letter-spacing:.8px!important;font-weight:800!important}
    @media(max-width:900px){.nav{background:#fffdfa!important}.brand img{width:44px!important;height:44px!important}.brand span{font-size:21px!important}}
  `;
  d.head.appendChild(style);
  const img=d.querySelector('.brand img');
  if(img){img.src='(0) RE_WITH_logo_corrected.png';img.removeAttribute('width');img.removeAttribute('height');}
});
</script>
</body>
</html>
