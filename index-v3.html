<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">
<title>RE WITH｜Medical Companion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="v3" src="index-v3-original.html" title="RE WITH Medical Companion"></iframe>
<script>
const frame=document.getElementById('v3');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const style=d.createElement('style');
  style.textContent=`
    .nav{height:72px!important;position:sticky!important;top:0!important;z-index:20!important;display:flex!important;align-items:center!important;justify-content:space-between!important;padding:0 42px!important;background:#fffdfa!important;border-bottom:1px solid #e7ddd5!important}
    .brand{display:flex!important;align-items:center!important;text-decoration:none!important;height:48px!important;gap:0!important;flex:none!important}
    .brand img{width:154px!important;height:48px!important;object-fit:contain!important;object-position:left center!important;display:block!important}
    .brand span{display:none!important}
    .navlinks{display:flex!important;gap:25px!important;align-items:center!important}
    .navlinks a{font-size:13px!important;color:#183049!important;text-decoration:none!important;white-space:nowrap!important}
    .navlinks .cta{background:#e59a96!important;color:#fff!important;padding:11px 18px!important;border-radius:999px!important}
    @media(max-width:900px){
      .nav{height:72px!important;padding:0 18px!important}
      .brand{height:48px!important}
      .brand img{width:136px!important;height:44px!important}
      .navlinks{overflow-x:auto!important;flex:1!important;gap:18px!important;justify-content:flex-start!important;scrollbar-width:none!important}
      .navlinks::-webkit-scrollbar{display:none!important}
      .navlinks a{font-size:12px!important}
    }
    @media(max-width:520px){
      .nav{padding:0 14px!important}
      .brand img{width:128px!important;height:44px!important}
      .navlinks{gap:16px!important}
      .navlinks a{font-size:11px!important}
    }
  `;
  d.head.appendChild(style);

  const logo=d.querySelector('.brand img');
  if(logo){
    logo.src='%280%29%20RE_WITH_logo_corrected.png';
    logo.alt='RE WITH';
    logo.removeAttribute('width');
    logo.removeAttribute('height');
  }

  const hero=d.querySelector('.hero-photo img');
  if(hero){hero.src='(1) 8E397198-8475-4462-A96E-2986FEDD8659.PNG?v=2';hero.alt='RE WITH 就醫陪伴';}
});
</script>
</body>
</html>
