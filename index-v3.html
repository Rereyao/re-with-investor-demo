<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f3ee">
<title>RE WITH｜Medical Companion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="v3" src="index-v3-original.html" title="RE WITH Medical Companion"></iframe>
<script>
const frame=document.getElementById('v3');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;

  /* Header copied exactly from index-v4.html */
  const style=d.createElement('style');
  style.textContent=`
    .nav{height:72px!important;position:sticky!important;top:0!important;z-index:20!important;display:flex!important;align-items:center!important;justify-content:space-between!important;padding:0 42px!important;background:#fffdfa!important;border-bottom:1px solid #e7ddd5!important}
    .brand{display:flex!important;align-items:center!important;gap:14px!important;color:#183049!important;text-decoration:none!important;font-weight:800!important;height:auto!important;flex:none!important}
    .brand img{width:54px!important;height:54px!important;object-fit:contain!important;display:block!important}
    .brand span{font-size:24px!important;letter-spacing:.8px!important;font-weight:800!important}
    .navlinks{display:flex!important;gap:25px!important;align-items:center!important}
    .navlinks a{font-size:13px!important;color:#183049!important;text-decoration:none!important;white-space:nowrap!important}
    .navlinks .cta{background:#e59a96!important;color:#fff!important;padding:11px 18px!important;border-radius:999px!important}
    @media(max-width:900px){
      .nav{height:76px!important;padding:0 18px!important;background:#fffdfa!important}
      .brand img{width:50px!important;height:50px!important}
      .brand span{font-size:21px!important}
      .navlinks{display:none!important}
    }
    @media(max-width:520px){
      .nav{padding:0 14px!important}
    }
  `;
  d.head.appendChild(style);

  const logo=d.querySelector('.brand img');
  if(logo){
    logo.src='(0) RE_WITH_logo_corrected.png';
    logo.alt='RE WITH';
    logo.removeAttribute('width');
    logo.removeAttribute('height');
  }

  const brand=d.querySelector('.brand');
  if(brand){
    let span=brand.querySelector('span');
    if(!span){
      span=d.createElement('span');
      brand.appendChild(span);
    }
    span.textContent='RE WITH';
  }
});
</script>
</body>
</html>
