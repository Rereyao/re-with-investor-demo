<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">
<title>RE WITH｜Medical Companion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="v3" src="index-v3-original.html" title="RE WITH Medical Companion"></iframe>
<script>
const frame=document.getElementById('v3');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const style=d.createElement('style');
  style.textContent=`
    .nav{background:#fff!important}
    .brand{gap:0!important;display:flex!important;align-items:center!important;height:72px!important}
    .brand img{width:auto!important;height:64px!important;max-width:220px!important;object-fit:contain!important;display:block!important;flex:0 0 auto!important}
    .brand span{display:none!important}
    @media(max-width:900px){
      .nav{background:#fff!important}
      .brand{height:64px!important}
      .brand img{height:56px!important;max-width:190px!important}
    }
  `;
  d.head.appendChild(style);

  const logo=d.querySelector('.brand img');
  if(logo){
    logo.src='header-logo-final.png.png';
    logo.alt='RE WITH';
    logo.removeAttribute('width');
    logo.removeAttribute('height');
  }

  const hero=d.querySelector('.hero-photo img');
  if(hero){hero.src='(1) 8E397198-8475-4462-A96E-2986FEDD8659.PNG?v=2';hero.alt='RE WITH 就醫陪伴';}
});
</script>
</body>
</html>
